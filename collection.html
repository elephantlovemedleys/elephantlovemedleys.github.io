<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>elephantlovemedleys</title>
<style>
  :root {
  --bg: #f5f7fa;
  --surface: #ffffff;
  --border: #e5eaf2;
  --text: #182030;
  --text-dim: #69758d;
  --accent: #2563eb;
  --hover: #f7fafd;
}

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial, sans-serif;
    line-height: 1.6;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  /* Nav */
  nav {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    margin-bottom: 40px;
  }

  nav a {
    flex: 1;
    text-align: center;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 14px;
    padding: 8px 10px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  }

  nav a.active {
  background: var(--hover);
  color: var(--text);
}

  nav svg { width: 15px; height: 15px; flex-shrink: 0; }

  @media (max-width: 420px) {
  nav {
    gap: 2px;
    padding: 4px;
  }
  nav a {
    font-size: 12px;
    padding: 8px 4px;
    gap: 4px;
  }
  nav svg {
    width: 13px;
    height: 13px;
  }
}
  
  .table-wrap
  {background:var(--surface);
   border:1px solid var(--border);
   border-radius:16px;
   overflow:hidden;
   box-shadow:0 14px 32px -18px rgba(18,28,48,.16)}
  
  .toolbar
  {display:flex;
   align-items:center;
   justify-content:space-between;
   padding:15px 20px;
   border-bottom:1px solid #ecf0f6;
   min-height:62px}

  h1
  {font-size:1rem;
   letter-spacing:-.01em}

  .bulk
  {display:none;
   align-items:center;
   gap:10px}

  .bulk.show
  {display:flex}

  .bulk span
  {font-size:.85rem;
   font-weight:600;
   color:#3d4a63}

  .bulk button
  {border:1px solid #d7deea;
   background:#fff;
   font-size:.8rem;
   font-weight:600;
   padding:7px 13px;
   border-radius:8px;
   cursor:pointer;
   color:#3d4a63;
   transition:background .15s}

  .bulk button:hover
  {background:#f2f5fa}

  .bulk .danger
  {color:#b42323;border-color:#f1c8c8}

  .bulk .danger:hover
  {background:#fdf1f1}

  table
  {width:100%;
   border-collapse:collapse;
   font-size:.88rem}

  th
  {text-align:left;
   font-size:.72rem;
   font-weight:700;
   letter-spacing:.06em;
   text-transform:uppercase;
   color:#69758d;
   padding:11px 20px;
   background:#f8fafc;
   border-bottom:1px solid #ecf0f6}

  td
  {padding:12px 20px;
   border-bottom:1px solid #f2f5f9;
   color:#34405a}

  tr:last-child td
  {border-bottom:0}

  input[type=checkbox]
  {width:16px;
   height:16px;
   accent-color:#2563eb;
   cursor:pointer}

  tbody tr.sel
  {background:#eff4ff}

  tbody tr:hover
  {background:#f7fafd}

  tbody tr.sel:hover
  {background:#e8effd}

  .name
  {font-weight:600;
   color:#182030}

  .email
  {color:#69758d}

  .role
  {font-size:.75rem;
   font-weight:700;
   padding:3px 10px;
   border-radius:999px;
   background:#eef1f6;
   color:#4a5670}

  .role.admin
  {background:#e7edff;
   color:#2b4acb}

</style>
</head>
<body>
<div class="wrap">

  <nav>
    <a href="/index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="/collection.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      Collection
    </a>
    <a href="/wants.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
  <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
</svg>
      Wants
    </a>
    <a href="/request.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      Request
    </a>
  </nav>


<div class="table-wrap">
  <div class="toolbar">
    <h1>Team members</h1>
    <div class="bulk" id="bulk"><span id="n"></span><button>Request</button><button class="danger">Cancel</button></div>
  </div>
  <table>
    <thead><tr><th><input type="checkbox" id="all" aria-label="Select all"></th><th>Name</th><th>Email</th><th>Role</th></tr></thead>
    <tbody id="rows">
      <tr><td><input type="checkbox" aria-label="Select row"></td><td class="name">Maja Lindgren</td><td class="email">maja@corvid.ai</td><td><span class="role admin">Admin</span></td></tr>
      <tr><td><input type="checkbox" aria-label="Select row"></td><td class="name">Diego Fuentes</td><td class="email">diego@corvid.ai</td><td><span class="role">Editor</span></td></tr>
      <tr><td><input type="checkbox" aria-label="Select row"></td><td class="name">Amara Obi</td><td class="email">amara@corvid.ai</td><td><span class="role">Editor</span></td></tr>
      <tr><td><input type="checkbox" aria-label="Select row"></td><td class="name">Jonas Weber</td><td class="email">jonas@corvid.ai</td><td><span class="role">Viewer</span></td></tr>
      <tr><td><input type="checkbox" aria-label="Select row"></td><td class="name">Yuki Tanaka</td><td class="email">yuki@corvid.ai</td><td><span class="role">Viewer</span></td></tr>
    </tbody>
  </table>
</div>
</div>
<script>
const boxes = [...document.querySelectorAll('#rows input')];
const all = document.getElementById('all');
function sync(){
  const n = boxes.filter(b => b.checked).length;
  boxes.forEach(b => b.closest('tr').classList.toggle('sel', b.checked));
  document.getElementById('bulk').classList.toggle('show', n > 0);
  document.getElementById('n').textContent = n + ' selected';
  all.checked = n === boxes.length;
  all.indeterminate = n > 0 && n < boxes.length;
}
boxes.forEach(b => b.addEventListener('change', sync));
all.addEventListener('change', () => { boxes.forEach(b => b.checked = all.checked); sync(); });
</script>   
</body>
</html>
